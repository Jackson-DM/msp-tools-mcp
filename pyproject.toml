[project]
name = "msp-tools-mcp"
version = "0.1.0"
description = "MCP server exposing the Summit Managed IT support toolset, with security guardrails enforced in the tool layer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Pinned to the stable v1 line. The v2 pre-release reworks the SDK for the
    # 2026-07-28 spec but ships marked not-for-production; see README "SDK version".
    "mcp>=1.28,<2",
]

[project.optional-dependencies]
# Guardrail stage 2. Deliberately optional: stage 1 is the deterministic floor
# and must run with no API dependency at all, so a clone of this repo works
# offline and incurs no API charges by default.
#   uv sync --extra classifier
# >=0.120 for output_config / JSON-schema structured output, which the
# classifier uses to constrain its verdict shape.
# truststore makes Python verify against the OS certificate store instead of
# certifi's bundle. Required on machines where antivirus or a corporate proxy
# re-signs HTTPS: the interception root is trusted by Windows but absent from
# certifi, so the SDK fails with a connection error. Same principle as uv's
# --system-certs. This preserves verification rather than weakening it.
classifier = ["anthropic>=0.120,<1", "truststore>=0.10"]

[project.scripts]
msp-tools-mcp = "msp_tools.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msp_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
